name: S7 packaging

on:
  pull_request:
    paths:
      - 'spikes/s7/**'
      - 'tools/test/s7.test.mjs'
      - '.github/workflows/s7-packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    env:
      S7_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.1'
      - run: rustup toolchain install stable --profile minimal
      - name: Build and test the native app
        shell: bash
        run: |
          node spikes/s7/build.mjs "$S7_RUNTIME" app
          s7_target=$(rustc --print host-tuple)
          CARGO_TARGET_DIR="$PWD/spikes/s7/out/$S7_RUNTIME/tauri-target" cargo test --manifest-path spikes/s7/src-tauri/Cargo.toml --target "$s7_target"
          node spikes/s7/measure.mjs sidecar "$S7_RUNTIME" "$PWD/spikes/s7/out/$S7_RUNTIME/fulcrum-core-$s7_target"
      - name: Upload measurements and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: s7-${{ matrix.runtime }}-measurements
          path: |
            spikes/s7/out/*/sidecar-*.json
            spikes/s7/src-tauri/Cargo.lock
          if-no-files-found: error
