name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check the isolated Gmail probe
        working-directory: spikes/s4/gmail-piece
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project spikes/s3 --frozen
      - run: uv run --project spikes/s3 python spikes/s3/check_clients.py
      - run: python3 -m unittest discover -s spikes/s3 -p 'test_*.py'
      - run: pnpm exec tsc --project spikes/s3/tsconfig.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:ui
      - run: git diff --exit-code -- schemas/v1 packages/schema/src

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
